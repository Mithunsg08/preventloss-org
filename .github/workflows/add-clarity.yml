name: Inject Clarity Script into HTML Files

on:
  workflow_dispatch:

jobs:
  inject-clarity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix Encoding and Update HTML files with Clarity Script
        run: |
          python3 -c '
          import os

          CLARITY_SCRIPT = """<script type="text/javascript">
              (function(c,l,a,r,i,t,y){
                  c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
              })(window, document, "clarity", "script", "xlrtp9eqdq");
          </script>"""

          updated_count = 0
          for root, dirs, files in os.walk("."):
              if "/." in root:
                  continue
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)

                      # Detect and read file safely handling UTF-16 / UTF-8
                      try:
                          with open(filepath, "r", encoding="utf-8-sig") as f:
                              content = f.read()
                      except UnicodeDecodeError:
                          try:
                              with open(filepath, "r", encoding="utf-16") as f:
                                  content = f.read()
                          except UnicodeDecodeError:
                              continue

                      # Clean up any leftover NULL spaces from UTF-16 corruption
                      if "\x00" in content:
                          content = content.replace("\x00", "")

                      # Inject Clarity script if not already present
                      if "clarity.ms/tag/" not in content and "</head>" in content:
                          content = content.replace("</head>", f"{CLARITY_SCRIPT}\n</head>")

                      # Save back as pure clean UTF-8
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(content)
                          
                      print(f"Repaired and Updated: {filepath}")
                      updated_count += 1

          print(f"Total files processed: {updated_count}")
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix UTF-16 encoding and inject Clarity script" || echo "No changes to commit"
          git push
