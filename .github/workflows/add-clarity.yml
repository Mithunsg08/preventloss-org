name: Add Clarity Cleanly

on:
  workflow_dispatch:

jobs:
  add-clarity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Clarity Tag
        run: |
          python3 -c '
          import os, re

          CLARITY_SCRIPT = """<script type="text/javascript">
              (function(c,l,a,r,i,t,y){
                  c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
              })(window, document, "clarity", "script", "xlrtp9eqdq");
          </script>"""

          modified_files = 0
          for root, dirs, files in os.walk("."):
              if "/." in root:
                  continue
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)
                      
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      # Skip if Clarity script is already present
                      if "clarity.ms/tag/" in content:
                          continue

                      # Regex matching </head> regardless of case or spaces (e.g. </HEAD>, </head >)
                      pattern = re.compile(r"(</head\s*>)", re.IGNORECASE)

                      if pattern.search(content):
                          new_content = pattern.sub(f"{CLARITY_SCRIPT}\n\\1", content, count=1)
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(new_content)
                          print(f"Successfully updated: {filepath}")
                          modified_files += 1
                      else:
                          print(f"Skipped (no </head> tag found): {filepath}")

          print(f"Done. Modified {modified_files} files.")
          '

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]"
          git add .
          git commit -m "Inject Clarity tracking script" || echo "No changes to commit"
          git push
