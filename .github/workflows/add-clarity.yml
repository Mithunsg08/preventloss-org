name: Restore Original HTML Files

on:
  workflow_dispatch:

jobs:
  revert-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to find the original commit

      - name: Reset HTML files to clean commit
        run: |
          # Revert all HTML files to commit 'bc65c94' (before encoding break)
          git checkout bc65c94 -- "*.html" "articles/*.html"
          
      - name: Commit and Push clean files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Restore all HTML files to clean UTF-8 state" || echo "No changes"
          git push
