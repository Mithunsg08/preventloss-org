name: Inject Clarity Script into HTML Files

on:
  workflow_dispatch:

jobs:
  inject-clarity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix Spaced Encoding and Inject Clarity Script
        run: |
          python3 -c '
          import os

          CLARITY_SCRIPT = """<script type="text/javascript">
              (function(c,l,a,r,i,t,y){
                  c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
              })(window, document, "clarity", "script", "xlrtp9eqdq");
          </script>"""

          for root, dirs, files in os.walk("."):
              if "/." in root:
                  continue
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)
                      
                      # Read raw bytes to safely remove UTF-16 null characters (\x00)
                      with open(filepath, "rb") as f:
                          raw = f.read()

                      # Strip null bytes caused by UTF-16 conversion
                      raw = raw.replace(b"\x00", b"")

                      # Decode as clean UTF-8
                      text = raw.decode("utf-8", errors="ignore")

                      # Inject Clarity script if missing
                      if "clarity.ms/tag/" not in text and "</head>" in text:
                          text = text.replace("</head>", f"{CLARITY_SCRIPT}\n</head>")

                      # Write back as clean, plain UTF-8
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(text)

                      print(f"Cleaned & Updated: {filepath}")
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix spaced text encoding error and add Clarity" || echo "No changes to commit"
          git push
