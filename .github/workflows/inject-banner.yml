name: Inject Banner Script into Article HTML Files

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master

jobs:
  inject-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run script to inject banner into article pages only
        run: |
          python -c '
          import os

          script_tag = "<script src=\"/banner.js\"></script>"

          for root, dirs, files in os.walk("."):
              # Skip hidden directories like .git or .github
              if "/." in root:
                  continue
              
              # ONLY process files inside the "articles" directory or subdirectories
              if "articles" in root.split(os.sep):
                  for file in files:
                      if file.endswith(".html"):
                          filepath = os.path.join(root, file)
                          with open(filepath, "r", encoding="utf-8") as f:
                              content = f.read()

                          # Inject script tag before </body> if not already present
                          if "banner.js" not in content and "</body>" in content:
                              new_content = content.replace("</body>", f"  {script_tag}\n</body>")
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.write(new_content)
                              print(f"Injected banner into: {filepath}")
          '

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: Inject banner.js into articles HTML files"
          branch: ${{ github.ref_name }}
